---
- name: Configure router
  hosts: router
  become: true
  tasks:
    - name: Enable IP forwarding
      ansible.posix.sysctl:
        name: net.ipv4.ip_forward
        value: '1'
        state: present
    - name: Set up NAT for bank-net
      ansible.builtin.command: >
        iptables -t nat -A POSTROUTING -s 10.0.1.0/24 -o eth2 -j MASQUERADE
      changed_when: false
    - name: Set up NAT for ics-net
      ansible.builtin.command: >
        iptables -t nat -A POSTROUTING -s 10.0.2.0/24 -o eth2 -j MASQUERADE
      changed_when: false

- name: Configure bank web server
  hosts: bank-web
  become: true
  tasks:
    - name: Install Apache2
      ansible.builtin.apt:
        update_cache: true
        name: apache2
        state: present
    - name: Deploy banking portal page
      ansible.builtin.copy:
        dest: /var/www/html/index.html
        content: "<h1>Welcome to Online Banking</h1><p>Secure login portal.</p>"
        mode: '0644'
    - name: Create User
      ansible.builtin.user:
        name: debian
        password: "$6$saltsalt$K1Y0Qz8X9p5L7x8z3J4k9w2m6n4p8r0t2v4x6y8z0a2b4c6d8e0f2g4h6i8j0k2l4m6n8p0q2r4s6t8u0v2w4x6y8z0" # qwerty!23 (hashed)
        state: present
    - name: Give sudo privileges
      ansible.builtin.copy:
        dest: /etc/sudoers.d/debian
        content: "debian ALL=(ALL) NOPASSWD:ALL"
        mode: '0440'
        validate: 'visudo -cf %s'

- name: Configure bank database
  hosts: bank-db
  become: true
  tasks:
    - name: Install MariaDB
      ansible.builtin.apt:
        update_cache: true
        name: mariadb-server
        state: present
    - name: Allow remote DB access
      ansible.builtin.lineinfile:
        path: /etc/mysql/mariadb.conf.d/50-server.cnf
        regexp: '^bind-address'
        line: 'bind-address = 0.0.0.0'
    - name: Create User
      ansible.builtin.user:
        name: debian
        password: "$6$saltsalt$K1Y0Qz8X9p5L7x8z3J4k9w2m6n4p8r0t2v4x6y8z0a2b4c6d8e0f2g4h6i8j0k2l4m6n8p0q2r4s6t8u0v2w4x6y8z0" # qwerty!23 (hashed)
        state: present
    - name: Give sudo privileges
      ansible.builtin.copy:
        dest: /etc/sudoers.d/debian
        content: "debian ALL=(ALL) NOPASSWD:ALL"
        mode: '0440'
        validate: 'visudo -cf %s'

- name: Configure substation RTU
  hosts: substation-rtu
  become: true
  tasks:
    - name: Install netcat for ICS port simulation
      ansible.builtin.apt:
        update_cache: true
        name: netcat-openbsd
        state: present
    - name: Open Modbus port (502)
      ansible.builtin.shell: nohup nc -lkp 502 >/dev/null 2>&1 &
      changed_when: false
    - name: Open S7comm port (102)
      ansible.builtin.shell: nohup nc -lkp 102 >/dev/null 2>&1 &
      changed_when: false
    - name: Create User
      ansible.builtin.user:
        name: debian
        password: "$6$saltsalt$K1Y0Qz8X9p5L7x8z3J4k9w2m6n4p8r0t2v4x6y8z0a2b4c6d8e0f2g4h6i8j0k2l4m6n8p0q2r4s6t8u0v2w4x6y8z0" # qwerty!23 (hashed)
        state: present
    - name: Give sudo privileges
      ansible.builtin.copy:
        dest: /etc/sudoers.d/debian
        content: "debian ALL=(ALL) NOPASSWD:ALL"
        mode: '0440'
        validate: 'visudo -cf %s'

- name: Remove UFW from all hosts
  hosts: all
  become: true
  tasks:
    - name: Remove UFW firewall
      ansible.builtin.apt:
        name: ufw
        state: absent
